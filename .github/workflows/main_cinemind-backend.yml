name: Verify and deploy CineMind backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SECRET_KEY: ci-only-9f3b7c1d5e8a2f6b4c7d0e3a9b1c5d8e2f6a4b7c0d3e9f1a
  TMDB_API_KEY: ci-placeholder
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  AUTH_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SESSION_COOKIE_SECURE: "True"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check --config pyproject.toml .
      - run: ruff format --check --config pyproject.toml .
      - run: python manage.py check
      - run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
        env:
          SECURE_SSL_REDIRECT: "False"
      - run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: python-app
          path: |
            config
            core
            user
            manage.py
            requirements.txt
            Procfile
            startup.sh

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-app
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_11E747225499432C82A9001BF8B9A054 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_19B7D0C6B4724791B4DA56AA001AEAC8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F331984236904D699EE7AA91D7236B71 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cinemind-backend
          slot-name: Production
